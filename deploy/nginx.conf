# Reverse proxy for the Sri Mathru Driving School Next.js server on 127.0.0.1:3000.
# Ubuntu/Debian: copy to /etc/nginx/sites-available/sri-mathru and symlink it
# into /etc/nginx/sites-enabled, then `systemctl reload nginx`.
# Replace every your-domain.example.com below with your real domain.

server {
    listen 80;
    server_name your-domain.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    # Obtain with certbot:  sudo certbot --nginx -d your-domain.example.com
    ssl_certificate     /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

    client_max_body_size 10m;

    # The app already sets security headers (HSTS, CSP, etc.) and powers the
    # rate limiter from the forwarded IP, so pass the headers through.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Long-cached static assets (Next fingerprints them).
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
