services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      CRON_SECRET: ${CRON_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
    volumes:
      - smds-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Drives the /api/cron scheduler (rolls the slot window forward and fires
  # due automations). Without it, reminders never get sent in production.
  scheduler:
    image: curlimages/curl:8.11.1
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_INTERNAL_URL: ${CRON_INTERNAL_URL:-http://web:3000}
    command: >
      /bin/sh -c 'while true; do
        curl -fsS -m 30 -H "Authorization: Bearer $${CRON_SECRET}" "$${CRON_INTERNAL_URL}/api/cron" >/dev/null 2>&1
        || echo "[scheduler] cron run failed at $(date -u +%FT%TZ)";
        sleep 1800;
      done'

volumes:
  smds-data:
